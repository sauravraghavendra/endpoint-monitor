name: sync

on:
  schedule:
    # Watchdog only. The chain below normally starts the next run; this heals
    # it if a run dies without handing off.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification to every configured channel"
        type: boolean
        default: false
      parent:
        description: "Run id that chained into this one (internal)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # One poller at a time. Overlapping runs exit here as SUCCESS in a few
      # seconds — no queue, so nothing ever gets cancelled (cancellations are
      # what generated the failure emails).
      - name: Yield if another run is already polling
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT: ${{ inputs.parent }}
        run: |
          older=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq "[.workflow_runs[]
                   | select(.name==\"sync\")
                   | select(.status==\"in_progress\" or .status==\"queued\")
                   | select(.id < $GITHUB_RUN_ID)
                   | select(.id != (\"${PARENT:-0}\" | tonumber))] | length" 2>/dev/null || echo 0)
          echo "older active runs: $older"
          if [ "${older:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.skip != 'true'

      - name: Run
        id: check
        if: steps.guard.outputs.skip != 'true'
        env:
          TEST_NOTIFY: ${{ inputs.test_notify }}
          # Poll ~5.7h per run, once a minute; the chain step then starts the
          # successor, giving continuous coverage.
          LOOP_SECONDS: "20400"
          LOOP_INTERVAL: "60"
          COMMIT_ON_SAVE: "true"
          TARGET_ID: ${{ secrets.TARGET_ID }}
          TARGET_NAME: ${{ secrets.TARGET_NAME }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_API_URL: ${{ secrets.TARGET_API_URL }}
          TARGET_DEADLINE_UTC: ${{ secrets.TARGET_DEADLINE_UTC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMS_EMAIL_GATEWAY: ${{ secrets.SMS_EMAIL_GATEWAY }}
          TEXTBELT_KEY: ${{ secrets.TEXTBELT_KEY }}
          TEXTBELT_PHONE: ${{ secrets.TEXTBELT_PHONE }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
        run: python3 poll.py

      - name: Persist
        if: ${{ steps.guard.outputs.skip != 'true' && !inputs.test_notify }}
        run: |
          if [ -n "$(git status --porcelain .cache)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .cache
            git commit -m "$(date -u +%FT%TZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push || true
          fi

      # Hand off to the next run. `always()` so a crash still chains; the
      # deadline check keeps it from restarting after the event.
      - name: Chain next run
        if: ${{ always() && steps.guard.outputs.skip != 'true' && !inputs.test_notify && steps.check.outputs.watch_ended != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sync -R "$GITHUB_REPOSITORY" -f parent="$GITHUB_RUN_ID" || true

      - name: Wind down
        if: steps.check.outputs.watch_ended == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable sync -R "$GITHUB_REPOSITORY"

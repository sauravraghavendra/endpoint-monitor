name: diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Probe
        env:
          TARGET_ID: ${{ secrets.TARGET_ID }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_API_URL: ${{ secrets.TARGET_API_URL }}
        run: python3 diag.py
